[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lots-twin"
version = "0.1.0"
description = "Geospatial data quality maze: decides what is reliable and never invents a value."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pyarrow>=14", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lots-twin = "lots_twin.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
